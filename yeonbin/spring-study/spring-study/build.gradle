plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
    // --- 핵심 웹 및 백엔드 기능 ---
    // 스프링 MVC, 내장 톰캣 등 웹 애플리케이션 구동에 필수적인 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // JPA(Java Persistence API)를 사용하여 DB 연동 및 ORM 지원
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- 프론트엔드 (템플릿 엔진) ---
    // Thymeleaf 템플릿 엔진 사용을 위한 스타터
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // Thymeleaf에서 레이아웃(공통된 화면 구조) 관리를 도와주는 확장 라이브러리
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // --- 데이터베이스 드라이버 ---
    // 개발/테스트 환경에서 주로 사용되는 가벼운 인메모리 DB (런타임 시에만 필요)
    runtimeOnly 'com.h2database:h2'

    // --- 개발 편의 도구 ---
    // Lombok: Getter/Setter 등 반복 코드를 줄여주는 라이브러리 (컴파일 시에만 필요)
    compileOnly 'org.projectlombok:lombok'
    // Lombok 어노테이션 프로세서 설정
    annotationProcessor 'org.projectlombok:lombok'
    // Spring Boot DevTools: 코드 변경 시 자동 재시작 등 개발 편의 기능 제공
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- 테스트 관련 ---
    // 스프링 부트 테스트 환경 구성을 위한 핵심 스타터 (JUnit 5, Mockito, AssertJ 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // JUnit 5 (Jupiter API): 테스트 코드 작성 시 사용
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // JUnit Platform Launcher: 테스트 실행을 위한 런처 (테스트 런타임 시 필요)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // --- 테스트 환경에서의 Lombok 설정 ---
    // 테스트 코드 컴파일 시 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'
    // 테스트 코드 어노테이션 프로세서 설정
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}


